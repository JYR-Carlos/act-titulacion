[pytest]
# `.` para importar el paquete `lsch_mr`; `scripts` para poder importar un CLI
# directamente en una prueba (`from demo_vivo import ...`) sin que la ruta
# dependa de desde dónde se lance pytest.
pythonpath = . scripts

# Marcadores registrados. Sin declararlos aquí, pytest emite un warning por
# cada uso y `-m "not camera"` filtraría en silencio sobre un marcador que
# podría estar mal escrito.
markers =
    camera: necesita una cámara conectada. Se excluye en CI con -m "not camera".
